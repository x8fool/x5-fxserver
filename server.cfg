endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# Resources
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure rconlog
ensure xcriptify-native

sv_scriptHookAllowed 0

# Server Info
sv_hostname "Xcriptify Studio"
sets sv_projectName "Xcriptify Studio"
sets sv_projectDesc "Xcriptify FiveM Server"
sets tags "roleplay"
sets locale "th-TH"

# Game Build
sv_enforceGameBuild 3258

# OneSync
set onesync on

# Slots
sv_maxclients 2

# Admin
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_principal identifier.fivem:1 group.admin

# Keys
set steam_webApiKey "api_key"
sv_licenseKey cfxk_api_key
