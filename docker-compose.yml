services:
  fivem:
    image: routmoute/fxserver:recommended
    tty: true
    stdin_open: true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./server.cfg:/opt/cfx-server/server.cfg
      - ./resources:/opt/cfx-server/resources
    ports:
      - "30120:30120/tcp"
      - "30120:30120/udp"
      - "40120:40120/tcp"
    command: +exec server.cfg
